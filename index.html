<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2の倍数or3の倍数 100本ノック</title>
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        #title-screen {
            cursor: pointer;
        }

        .hidden { display: none !important; }

        .screen-bg {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            position: absolute;
            z-index: 1;
        }

        #start-text {
            position: absolute;
            bottom: 5%;
            z-index: 2;
            color: #fff;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        #result-content {
            position: absolute;
            bottom: 30%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #fff;
            font-size: clamp(1.2rem, 4vw, 2rem);
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .text-yellow {
            color: #ffeb3b;
            font-weight: bold;
        }

        #game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        #screen-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; 
            overflow: hidden;
        }

        #bg-image {
            max-width: 100vw;
            max-height: calc(100vh - 80px);
            width: auto;
            height: auto;
            display: block;
            z-index: 1;
        }

        #number-display {
            position: absolute;
            z-index: 2;
            font-size: min(150px, 35vw);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            font-weight: normal;
            color: #ffffff;
        }

        #anim-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center; align-items: center;
            z-index: 3;
            pointer-events: none;
        }

        #anim-img {
            opacity: 0;
            transform: scale(0.1);
        }

        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .zoom-anim {
            width: 100%; height: 100%;
            object-fit: contain; 
            animation: zoomIn 1.5s ease-out forwards;
        }

        #ui-area {
            position: relative;
            height: 80px;
            width: 100%;
            background-color: #000;
            display: flex;
            justify-content: center; 
            align-items: center;
            flex-shrink: 0; 
        }

        #button-container {
            display: flex;
            gap: 20px;
        }

        button {
            width: 60px;
            height: 60px;
            font-size: 2rem;
            font-weight: normal;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 4px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        #btn-circle { background-color: #ff4d4d; }
        #btn-cross { background-color: #3399ff; }
        
        button:active { transform: scale(0.9); }
        button:disabled { filter: grayscale(80%); cursor: not-allowed; transform: none; }

        #counter {
            position: absolute;
            right: 20px; 
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="title-screen" class="screen" onclick="startGame()">
        <img src="title.png" class="screen-bg" alt="タイトル">
        <div id="start-text">CLICK TO START</div>
    </div>

    <div id="game-wrapper" class="screen hidden">
        <div id="screen-area">
            <img id="bg-image" src="" alt="背景">
            <div id="number-display">--</div>
            
            <div id="anim-container">
                <img id="anim-img" src="" alt="">
            </div>
        </div>

        <div id="ui-area">
            <div id="button-container">
                <button id="btn-circle" onclick="answer('circle')">〇</button>
                <button id="btn-cross" onclick="answer('cross')">✕</button>
            </div>
            
            <div id="counter"><span id="current-q">1</span> / <span id="max-q">100</span></div>
        </div>
    </div>

    <div id="result-screen" class="screen hidden" onclick="location.reload()">
        <img src="result.png" class="screen-bg" alt="リザルト">
        <div id="result-content">
            <div id="best-score-label" class="text-yellow hidden">ベストスコア</div>
            <div>あなたのレコード</div>
            <div>正解数：<span id="res-correct">0</span></div>
            <div id="res-time">0時間 0分 0秒</div>
            <div>取得した日時：</div>
            <div id="res-date"></div>
        </div>
    </div>

    <script>
        const GAME_CONFIG = {
            maxQuestions: 100,        
            numberMin: 1,             
            numberMax: 99,            
            
            fileBg: 'image3.png',
            fileCorrect: 'image1.png',
            fileWrong: 'image2.png',
            
            audioOh: 'Oh.mp3',
            audioCircle: 'YES.mp3',
            audioCross: 'NO.mp3',
            audioCorrect: 'OK.mp3',
            audioWrong: 'OMG.mp3',
            audioHakusyu: 'hakusyu.mp3'
        };

        let currentQuestion = 1;
        let currentNumber = 0;
        let isAnimating = false; 
        
        let correctCount = 0;
        let startTime = 0;

        const currentQText = document.getElementById('current-q');
        const maxQText = document.getElementById('max-q');
        const numberDisplay = document.getElementById('number-display');
        const animImg = document.getElementById('anim-img');
        const btnCircle = document.getElementById('btn-circle');
        const btnCross = document.getElementById('btn-cross');
        
        document.getElementById('bg-image').src = GAME_CONFIG.fileBg;
        maxQText.textContent = GAME_CONFIG.maxQuestions;

        const sndOh = new Audio(GAME_CONFIG.audioOh);
        const sndCircle = new Audio(GAME_CONFIG.audioCircle);
        const sndCross = new Audio(GAME_CONFIG.audioCross);
        const sndCorrect = new Audio(GAME_CONFIG.audioCorrect);
        const sndWrong = new Audio(GAME_CONFIG.audioWrong);
        const sndHakusyu = new Audio(GAME_CONFIG.audioHakusyu);

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function playAudioAsync(audioObj) {
            return new Promise(resolve => {
                audioObj.currentTime = 0;
                audioObj.onended = resolve;
                audioObj.play().catch(e => {
                    console.log("Audio play error:", e);
                    resolve();
                });
            });
        }

        async function startGame() {
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('game-wrapper').classList.remove('hidden');
            
            currentQuestion = 1;
            correctCount = 0;
            startTime = Date.now();
            
            updateCounter();
            await generateNumber();
        }

        async function generateNumber() {
            const min = GAME_CONFIG.numberMin;
            const max = GAME_CONFIG.numberMax;
            currentNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            numberDisplay.textContent = currentNumber;
            
            await playAudioAsync(sndOh);
        }

        function updateCounter() {
            currentQText.textContent = currentQuestion;
        }

        async function answer(playerChoice) {
            if (isAnimating) return; 
            isAnimating = true;
            btnCircle.disabled = true;
            btnCross.disabled = true;

            const isMultiple = (currentNumber % 2 === 0 || currentNumber % 3 === 0);
            let isCorrect = false;
            if (isMultiple) {
                isCorrect = (playerChoice === 'circle');
            } else {
                isCorrect = (playerChoice === 'cross');
            }
            if (isCorrect) correctCount++;

            animImg.className = '';
            animImg.style.opacity = 0;
            animImg.src = isCorrect ? GAME_CONFIG.fileCorrect : GAME_CONFIG.fileWrong;

            void animImg.offsetWidth; 
            animImg.classList.add('zoom-anim');

            const choiceAudio = playerChoice === 'circle' ? sndCircle : sndCross;
            await playAudioAsync(choiceAudio);
            await wait(150);

            const resultAudio = isCorrect ? sndCorrect : sndWrong;

            await Promise.all([
                playAudioAsync(resultAudio),
                wait(1200) 
            ]);

            await wait(200);

            animImg.className = '';
            animImg.style.opacity = 0;

            if (currentQuestion < GAME_CONFIG.maxQuestions) {
                currentQuestion++;
                updateCounter();
                await generateNumber();
                
                isAnimating = false;
                btnCircle.disabled = false;
                btnCross.disabled = false;
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('game-wrapper').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            sndHakusyu.currentTime = 0;
            sndHakusyu.play().catch(e => console.log("Audio play error:", e));
            
            const endTime = Date.now();
            const timeMs = Math.max(0, endTime - startTime);
            
            const h = Math.floor(timeMs / (1000 * 60 * 60));
            const m = Math.floor((timeMs % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((timeMs % (1000 * 60)) / 1000);
            
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const dateStr = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            
            document.getElementById('res-correct').textContent = correctCount;
            document.getElementById('res-time').textContent = `${h}時間 ${m}分 ${s}秒`;
            document.getElementById('res-date').textContent = dateStr;
            
            const currentScore = {
                correct: correctCount,
                time: timeMs
            };
            
            let isBest = false;
            const saved = localStorage.getItem('twoOrThreeGameRecord');
            
            if (saved) {
                const bestScore = JSON.parse(saved);
                if (currentScore.correct > bestScore.correct || 
                   (currentScore.correct === bestScore.correct && currentScore.time < bestScore.time)) {
                    isBest = true;
                }
            } else {
                isBest = true;
            }
            
            const bestLabel = document.getElementById('best-score-label');
            if (isBest) {
                localStorage.setItem('twoOrThreeGameRecord', JSON.stringify(currentScore));
                bestLabel.classList.remove('hidden');
            } else {
                bestLabel.classList.add('hidden');
            }
        }

        document.addEventListener('keydown', (e) => {
            if ((e.key === 'd' || e.key === 'D') && !document.getElementById('title-screen').classList.contains('hidden')) {
                document.getElementById('title-screen').classList.add('hidden');
                correctCount = 99; 
                startTime = Date.now() - (1000 * 60 * 5); 
                showResult();
            }
        });
    </script>
</body>
</html>
