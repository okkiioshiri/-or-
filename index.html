<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2の倍数or3の倍数 100本ノック</title>
    
    <!-- ==========================================
         【デザイン設定】 (CSS)
    =========================================== -->
    <style>
        /* --- 画面全体のレイアウト --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }

        /* --- 上部：ゲーム画面エリア --- */
        #screen-area {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* 白い余白を削除 */
        }

        #bg-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* ★画像の縦横比を保ったまま、隙間なく画面を埋め尽くす設定 */
            object-fit: cover; 
            z-index: 1;
        }

        #number-display {
            position: absolute;
            z-index: 2;
            font-size: 15vw;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px #000, 0 0 20px #000, 4px 4px 0 #000;
        }

        #anim-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center; align-items: center;
            z-index: 3;
            pointer-events: none;
        }

        #anim-img {
            opacity: 0;
            transform: scale(0.1);
        }

        /* --- アニメーション設定 --- */
        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .zoom-anim {
            width: 100%; height: 100%;
            /* ★迫ってくる画像も、隙間なく画面を埋め尽くす設定 */
            object-fit: cover; 
            animation: zoomIn 0.8s ease-out forwards;
        }

        /* --- 下部：UI（操作）エリア --- */
        #ui-area {
            position: relative;
            height: 80px; /* 下部の黒い帯の高さ */
            background-color: #000; /* 黒背景 */
            display: flex;
            justify-content: center; 
            align-items: center;
            flex-shrink: 0; 
        }

        /* --- ボタン --- */
        #button-container {
            display: flex;
            gap: 20px;
        }

        button {
            width: 60px;
            height: 60px;
            font-size: 2rem;
            font-weight: normal;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 4px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        #btn-circle { background-color: #ff4d4d; }
        #btn-cross { background-color: #3399ff; }
        
        button:active { transform: scale(0.9); }
        button:disabled { filter: grayscale(80%); cursor: not-allowed; transform: none; }

        /* --- カウンター --- */
        #counter {
            position: absolute;
            right: 40px; 
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         【画面の骨組み】 (HTML)
    =========================================== -->
    <div id="screen-area">
        <img id="bg-image" src="" alt="背景">
        <div id="number-display">--</div>
        
        <div id="anim-container">
            <img id="anim-img" src="" alt="">
        </div>
    </div>

    <div id="ui-area">
        <div id="button-container">
            <button id="btn-circle" onclick="answer('circle')">〇</button>
            <button id="btn-cross" onclick="answer('cross')">✕</button>
        </div>
        
        <div id="counter"><span id="current-q">1</span> / <span id="max-q">100</span></div>
    </div>

    <!-- ==========================================
         【ゲームの動き】 (JavaScript)
    =========================================== -->
    <script>
        const GAME_CONFIG = {
            maxQuestions: 100,        
            waitTimeMs: 1500,         
            numberMin: 1,             
            numberMax: 99,            
            
            fileBg: 'image3.png',
            fileCorrect: 'image1.png',
            fileWrong: 'image2.png',
            audioCorrect: 'YES.mp3',
            audioWrong: 'OMG.mp3'
        };

        let currentQuestion = 1;
        let currentNumber = 0;
        let isAnimating = false; 

        const currentQText = document.getElementById('current-q');
        const maxQText = document.getElementById('max-q');
        const numberDisplay = document.getElementById('number-display');
        const animImg = document.getElementById('anim-img');
        const btnCircle = document.getElementById('btn-circle');
        const btnCross = document.getElementById('btn-cross');
        
        document.getElementById('bg-image').src = GAME_CONFIG.fileBg;
        maxQText.textContent = GAME_CONFIG.maxQuestions;

        const sndYes = new Audio(GAME_CONFIG.audioCorrect);
        const sndOmg = new Audio(GAME_CONFIG.audioWrong);

        window.onload = () => {
            generateNumber();
            updateCounter();
        };

        function generateNumber() {
            const min = GAME_CONFIG.numberMin;
            const max = GAME_CONFIG.numberMax;
            currentNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            numberDisplay.textContent = currentNumber;
        }

        function updateCounter() {
            currentQText.textContent = currentQuestion;
        }

        function playSound(isCorrect) {
            if (isCorrect) {
                sndYes.currentTime = 0; 
                sndYes.play().catch(e => console.log("音声再生エラー(正解):", e));
            } else {
                sndOmg.currentTime = 0;
                sndOmg.play().catch(e => console.log("音声再生エラー(不正解):", e));
            }
        }

        function answer(playerChoice) {
            if (isAnimating) return; 
            isAnimating = true;
            btnCircle.disabled = true;
            btnCross.disabled = true;

            const isMultiple = (currentNumber % 2 === 0 || currentNumber % 3 === 0);
            
            let isCorrect = false;
            if (isMultiple) {
                isCorrect = (playerChoice === 'circle');
            } else {
                isCorrect = (playerChoice === 'cross');
            }

            animImg.className = '';
            animImg.style.opacity = 0;

            if (isCorrect) {
                animImg.src = GAME_CONFIG.fileCorrect;
                playSound(true); 
            } else {
                animImg.src = GAME_CONFIG.fileWrong;
                playSound(false); 
            }

            void animImg.offsetWidth; 
            animImg.classList.add('zoom-anim');

            setTimeout(() => {
                animImg.className = '';
                animImg.style.opacity = 0;

                if (currentQuestion < GAME_CONFIG.maxQuestions) {
                    currentQuestion++;
                    updateCounter();
                    generateNumber();
                    
                    isAnimating = false;
                    btnCircle.disabled = false;
                    btnCross.disabled = false;
                } else {
                    alert(`${GAME_CONFIG.maxQuestions}問達成お疲れ様でした！`);
                    
                    currentQuestion = 1;
                    updateCounter();
                    generateNumber();
                    
                    isAnimating = false;
                    btnCircle.disabled = false;
                    btnCross.disabled = false;
                }
            }, GAME_CONFIG.waitTimeMs);
        }
    </script>
</body>
</html>
